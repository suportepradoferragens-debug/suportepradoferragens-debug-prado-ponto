<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123b2a">
  <title>Conectando ao Google</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#123b2a;color:#172018}
    .card{width:min(420px,100%);background:white;border-radius:26px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
    .mark{width:44px;height:44px;border-radius:14px;background:#eef3ef;color:#123b2a;display:grid;place-items:center;font-weight:900}
    h1{margin:20px 0 8px;font-size:28px}p{color:#69736c;line-height:1.5}
    .status{margin-top:18px;padding:14px;border-radius:14px;background:#f3f6f3;font-weight:700}
    a{display:block;margin-top:14px;padding:13px 16px;border-radius:14px;background:#123b2a;color:#fff;text-align:center;text-decoration:none;font-weight:800}
    small{display:block;margin-top:14px;color:#7a837d}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">P</div>
    <h1>Conectando ao Google…</h1>
    <p>Esta tela confirma que o botão do Prado Ponto funcionou. Agora vamos abrir a autenticação segura.</p>
    <div class="status" id="status">Preparando login…</div>
    <a id="manualLink" href="https://coeqnnanqzlkkgkejbef.supabase.co/auth/v1/authorize?provider=google&redirect_to=https%3A%2F%2Fsuportepradoferragens-debug-prado-p.vercel.app">Abrir Google agora</a>
    <small>Se esta tela aparecer, o toque está funcionando corretamente.</small>
  </main>
  <script>
    const oauth='https://coeqnnanqzlkkgkejbef.supabase.co/auth/v1/authorize?provider=google&redirect_to=https%3A%2F%2Fsuportepradoferragens-debug-prado-p.vercel.app';
    document.getElementById('status').textContent='Abrindo autenticação…';
    setTimeout(()=>{ window.location.replace(oauth); },1200);
  </script>
</body>
</html>
